<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام إدارة الرواتب</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-box{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 4px 20px rgba(20,30,60,.08); padding:2rem; width:100%; max-width:380px;
  }
  .login-box h1{ font-size:1.5rem; margin-bottom:.3rem; text-align:center; }
  .login-box .sub{ color:var(--muted); font-size:.88rem; text-align:center; margin-bottom:1.5rem; }
</style>
</head>
<body>

  <div class="login-box">
    <h1>دفتر الرواتب</h1>
    <div class="sub">سجّل الدخول للمتابعة</div>
    <div id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" style="width:100%; justify-content:center">دخول</button>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/login.js"></script>
</body>
</html>
